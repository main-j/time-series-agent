[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ts-agent"
version = "0.1.0"
description = "Prompt-only hierarchical time-series agent for MMTS-Bench"
requires-python = ">=3.10"
dependencies = [
  "torch",
  "transformers",
  "accelerate",
  "safetensors",
  "huggingface_hub",
  "pydantic>=2",
  "pyyaml",
  "tqdm",
  "numpy",
  "pandas",
  "scipy",
  "statsmodels",
  "dtaidistance",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
ts-agent-run = "ts_agent.cli:main"